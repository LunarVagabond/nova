[workspace]
resolver = "2"
members = [
    "crates/nova-engine",
    "crates/nova-cli",
    "crates/nova-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LunarVagabond/nova"
publish = false

[workspace.dependencies]
nova-engine = { path = "crates/nova-engine" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
indexmap = "2"
openapiv3 = "2"
roxmltree = "0.20"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tiny_http = "0.12"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
url = "2"
