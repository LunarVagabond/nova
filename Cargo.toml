[workspace]
resolver = "2"
members = [
    "crates/nova-engine",
    "crates/nova-cli",
    "crates/nova-app/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LunarVagabond/nova"
publish = false

[workspace.dependencies]
nova-engine = { path = "crates/nova-engine" }
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
csv = "1"
http = "1.5.0"
httpdate = "1"
indexmap = "2"
md5 = "0.7"
openapiv3 = "2"
prost = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.9.1"
rand = "0.10"
roxmltree = "0.20"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1.53.1", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
