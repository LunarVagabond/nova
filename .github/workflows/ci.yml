name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # nova-app/src-tauri is a workspace member, so building/linting the
      # workspace requires Tauri's Linux system deps even though this job
      # never produces a desktop bundle. Matches Tauri's own documented CI
      # dependency list for Ubuntu.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test -p nova-engine

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/nova-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/nova-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
