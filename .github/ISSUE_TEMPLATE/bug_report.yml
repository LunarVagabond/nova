name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A few details help us reproduce it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: e.g. `nova validate` reports a duplicate environment name that doesn't exist
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: e.g. Validation should pass with no issues
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project with this nova.yaml / directory layout
        2. Run this command
        3. ...
      value: |
        1.
        2.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected crate/component
      placeholder: e.g. nova-engine (collection discovery), nova-cli, nova-app (desktop)

  - type: input
    id: version
    attributes:
      label: Nova version
      placeholder: e.g. 0.1.0 or main @ abc1234

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Rust toolchain version:
        Interface used (CLI / desktop app):
