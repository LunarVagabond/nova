[package]
name = "nova-engine"
description = "Core project/request engine for Nova. Owns project discovery, manifest parsing, environment loading, collection/request discovery, and (eventually) request execution. The CLI and desktop app are thin interfaces over this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
csv.workspace = true
http.workspace = true
httpdate.workspace = true
indexmap.workspace = true
md5.workspace = true
openapiv3.workspace = true
prost.workspace = true
prost-reflect.workspace = true
protox.workspace = true
rand.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tiny_http.workspace = true
tokio.workspace = true
tonic.workspace = true
tungstenite.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
bytes = "1.12.1"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http2"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }
